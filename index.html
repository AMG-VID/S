<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>معمل الفيزياء التفاعلي | Interactive Physics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Great+Vibes&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--pn:#0f172a;--ac:#38bdf8;--ac2:#a78bfa;--tx:#e2e8f0;--mu:#94a3b8;--bd:rgba(56,189,248,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pn);z-index:10}
header{background:linear-gradient(135deg,#1e1b4b,#0f172a 50%,#0c4a6e);padding:1.5rem 1rem;border-bottom:1px solid var(--bd)}
.hi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
h1{font-size:1.7rem;background:linear-gradient(135deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.st{color:var(--mu);font-size:.9rem}.tg{color:#64748b;font-size:.82rem}
.sig{text-align:center;padding:.6rem 1.3rem;border:1px solid var(--bd);border-radius:16px;background:rgba(15,23,42,.6)}
.sl{font-size:.68rem;color:#64748b;letter-spacing:2px}
.sa{font-family:'Aref Ruqaa',serif;font-size:1.8rem;color:var(--ac);line-height:1.2;text-shadow:0 0 18px rgba(56,189,248,.4)}
.se{font-family:'Great Vibes',cursive;font-size:1.5rem;color:var(--ac2);line-height:1.1}
nav{background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;overflow-x:auto;white-space:nowrap;padding:.6rem .8rem;display:flex;gap:.4rem}
.tab,.chip,.btn{font-family:inherit;cursor:pointer;border:1px solid transparent;transition:.2s}
.tab{padding:.5rem .9rem;border-radius:8px;background:rgba(30,41,59,.8);color:var(--mu);font-size:.82rem;font-weight:600;flex:none}
.tab i{font-style:normal;opacity:.6;font-size:.7rem}
.tab.on{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff}
main{max-width:1200px;margin:1rem auto;padding:0 .8rem}
.lst{display:flex;flex-wrap:wrap;gap:.4rem;max-height:116px;overflow-y:auto;padding:.4rem;border:1px solid var(--bd);border-radius:12px;background:rgba(15,23,42,.5)}
.chip{padding:.3rem .7rem;border-radius:20px;background:rgba(30,41,59,.8);color:var(--mu);font-size:.78rem}
.chip.on{background:rgba(56,189,248,.2);color:var(--ac);border-color:var(--ac)}
.ph{margin:.9rem 0 .6rem}.ph h2{font-size:1.2rem;color:var(--ac)}
.eq{color:var(--ac2);font-family:'Courier New',monospace;font-size:.9rem;direction:ltr;text-align:right;min-height:1.4em}
.stage{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:900px){.stage{grid-template-columns:1fr 340px}}
.cw{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:380px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.hint{padding:.4rem .8rem;font-size:.78rem;color:#64748b;border-top:1px solid rgba(56,189,248,.1)}
.side{display:flex;flex-direction:column;gap:.8rem}
.ctl,.out{background:rgba(15,23,42,.7);border:1px solid var(--bd);border-radius:16px;padding:.9rem;display:flex;flex-direction:column;gap:.7rem}
.ctl:empty{display:none}
.cg label{font-size:.84rem;color:var(--mu);display:flex;justify-content:space-between;gap:.5rem}
.cg b{color:var(--ac);font-family:'Courier New',monospace;direction:ltr;font-weight:600}
input[type=range]{width:100%;height:6px;background:#1e293b;border-radius:3px;-webkit-appearance:none;appearance:none;margin-top:.5rem}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#8b5cf6);box-shadow:0 0 10px rgba(14,165,233,.6)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:none;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}
.out div{display:flex;justify-content:space-between;gap:.5rem;font-size:.84rem;border-bottom:1px dashed rgba(56,189,248,.12);padding-bottom:.2rem}
.out span{color:var(--mu)}.out b{color:var(--ac);font-family:'Courier New',monospace;direction:ltr;text-align:left}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.btn{padding:.65rem;border-radius:10px;background:rgba(30,41,59,.8);color:var(--mu);font-weight:600;font-size:.88rem;border-color:var(--bd)}
.btn.p{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff;border:none}
footer{text-align:center;padding:2rem 1rem;margin-top:2rem;border-top:1px solid rgba(56,189,248,.1);color:#64748b;font-size:.85rem}
.fs{margin-top:.8rem;display:flex;justify-content:center;align-items:center;gap:1.2rem;flex-wrap:wrap}
.fs .sa{font-size:1.4rem}.fs .se{font-size:1.2rem}
</style>
</head>
<body>
<header><div class="hi"><div><h1>معمل الفيزياء التفاعلي</h1><p class="st">Interactive Physics Laboratory</p><p class="tg" id="tg"></p></div>
<div class="sig"><div class="sl">إشراف وتصميم</div><div class="sa">أمجد موسي</div><div class="se">Amgad Mousa</div></div></div></header>
<nav id="cats"></nav>
<main>
<div id="lst" class="lst"></div>
<div class="ph"><h2 id="ttl"></h2><p class="eq" id="eq"></p></div>
<div class="stage">
<div class="cw"><canvas id="cv"></canvas><p class="hint" id="hint"></p></div>
<div class="side"><div class="ctl" id="ctl"></div><div class="out" id="out"></div>
<div class="btns"><button class="btn p" id="rs">🔄 إعادة التشغيل</button><button class="btn" id="pp">⏸ إيقاف</button><button class="btn" id="pv">‹ السابقة</button><button class="btn" id="nx">التالية ›</button></div></div>
</div>
</main>
<footer><p>معمل الفيزياء التفاعلي — جرّب بنفسك، حرّك الأجسام بإصبعك أو بالماوس</p>
<div class="fs"><span class="sa">أمجد موسي</span><span class="se">Amgad Mousa</span></div></footer>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let W=300,H=380,cur=null,idx=0,P={},S={},Z={},drag=0,paused=false,last=0,lo=0;
const E=[],K={},D=Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=(v,d=2)=>{if(typeof v!=='number'||isNaN(v))return'—';if(!isFinite(v))return'∞';const a=Math.abs(v);return(a!==0&&(a<0.01||a>=1e6))?v.toExponential(2):(+v.toFixed(d)).toString()};
const q=(id,l,a,b,st,v,u,r)=>[id,l,a,b,st,v,u||'',r?1:0];
const s=(id,l,a,b,v,u,st)=>[id,l,a,b,st||((b-a)>=20?1:(b-a)>=2?.1:.01),v,u||'',0];

/* ===== أدوات الرسم ===== */
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=Math.max(r.width,200);H=Math.max(r.height,200);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);ctx.direction='ltr'}
function ln(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function dot(x,y,r,c,g){ctx.fillStyle=c;if(g){ctx.shadowColor=c;ctx.shadowBlur=g}ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0}
function tx(t,x,y,c,a,sz){ctx.fillStyle=c||'#94a3b8';ctx.font=(sz||12)+'px Cairo,monospace';ctx.textAlign=a||'center';ctx.fillText(t,x,y)}
function arr(x1,y1,x2,y2,c,w,hd){hd=hd||9;ln(x1,y1,x2,y2,c,w||2);const a=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hd*Math.cos(a-.4),y2-hd*Math.sin(a-.4));ctx.lineTo(x2-hd*Math.cos(a+.4),y2-hd*Math.sin(a+.4));ctx.fill()}
function grid(){ctx.strokeStyle='rgba(56,189,248,.06)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke()}
function setP(id,v){const d=cur.all.find(z=>z[0]===id);if(!d)return;v=clamp(v,d[2],d[3]);v=+(Math.round(v/d[4])*d[4]).toFixed(4);P[id]=v;const e=$('s_'+id);if(e){e.value=v;$('v_'+id).textContent=num(v)+' '+d[6]}}

/* ===== 1. السقوط الحر ===== */
K.fall={eq:'h = ½gt²  ،  v = gt',hint:'اسحب الكرة لأعلى أو لأسفل لتغيير الارتفاع',
par:[q('g','عجلة الجاذبية g',1,25,.1,9.8,'m/s²',1),q('h','الارتفاع h',10,200,5,100,'m',1),q('m','الكتلة m',.1,10,.1,1,'kg'),q('c','مقاومة الهواء',0,.5,.01,0,'',1)],
init(){S.y=0;S.v=0;S.t=0;S.d=0;S.w=0},
step(dt){if(drag)return;if(S.d){S.w+=dt;if(S.w>3)K.fall.init();return}S.t+=dt;const n=6,h=dt/n;for(let i=0;i<n;i++){S.v+=(P.g-P.c*S.v*Math.abs(S.v)/P.m)*h;S.y+=S.v*h}if(S.y>=P.h){S.y=P.h;S.d=1}},
draw(){grid();const g0=H-35,sc=(H-70)/200,x=W/2;ln(30,g0,W-30,g0,'#475569',3);
for(let h=0;h<=200;h+=20){const y=g0-h*sc;ln(30,y,h%100?38:46,y,'#475569',1);if(h%50===0)tx(h+'m',50,y+4,'#64748b','left',11)}
const top=g0-P.h*sc,by=top+S.y*sc;ln(x,top,x,by,'rgba(56,189,248,.35)',2,[4,4]);dot(x,by,13,'#38bdf8',18);
if(S.v>1)arr(x+26,by,x+26,by+clamp(S.v*2,6,90),'#f59e0b');
tx(Z.pl||'الأرض',W-14,24,'#a78bfa','right',14);tx('g = '+num(P.g)+' m/s²',W-14,44,'#64748b','right',12)},
down(x,y){const g0=H-35,sc=(H-70)/200,by=g0-P.h*sc+S.y*sc;if(Math.hypot(x-W/2,y-by)<32){drag=1;return 1}},
move(x,y){setP('h',(H-35-y)/((H-70)/200));S.y=0;S.v=0;S.t=0;S.d=0},
up(){K.fall.init()},
out(){return[['الزمن t',S.t,'s'],['السرعة v',S.v,'m/s'],['الارتفاع المتبقي',P.h-S.y,'m'],['زمن السقوط (بدون هواء)',Math.sqrt(2*P.h/P.g),'s']]}};

/* ===== 2. المقذوفات ===== */
const pg=()=>{const vx=P.v*Math.cos(P.a*D),vy=P.v*Math.sin(P.a*D),tf=(vy+Math.sqrt(vy*vy+2*P.g*P.h0))/P.g;return{vx,vy,tf,R:vx*tf,Hm:P.h0+vy*vy/(2*P.g)}};
const pv=()=>{const g=pg(),xm=Math.max(g.R,10)*1.1,ym=Math.max(g.Hm,5)*1.25;return{g,sc:Math.min((W-70)/xm,(H-70)/ym),ox:40,oy:H-35}};
K.proj={eq:'R = v²sin2θ / g  ،  H = v²sin²θ / 2g',hint:'اسحب رأس السهم البرتقالي لتغيير الزاوية والسرعة',
par:[q('v','السرعة الابتدائية v₀',5,80,1,30,'m/s',1),q('a','زاوية الإطلاق θ',0,85,1,45,'°',1),q('g','الجاذبية g',1,25,.1,9.8,'m/s²',1),q('h0','ارتفاع الإطلاق',0,50,1,0,'m',1)],
init(){S.t=0;S.d=0;S.w=0},
step(dt){if(drag)return;const g=pg();if(!S.d){S.t+=dt;if(S.t>=g.tf){S.t=g.tf;S.d=1}}else{S.w+=dt;if(S.w>2.5)K.proj.init()}},
draw(){grid();const{g,sc,ox,oy}=pv(),ly=oy-P.h0*sc;ln(20,oy,W-10,oy,'#475569',3);
if(P.h0>0){ctx.fillStyle='#1e293b';ctx.fillRect(ox-30,ly,30,oy-ly)}
ctx.strokeStyle='rgba(56,189,248,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();
for(let i=0;i<=60;i++){const t=g.tf*i/60,px=ox+g.vx*t*sc,py=oy-(P.h0+g.vy*t-.5*P.g*t*t)*sc;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();ctx.setLineDash([]);
ctx.strokeStyle='#38bdf8';ctx.lineWidth=2.5;ctx.beginPath();
for(let i=0;i<=40;i++){const t=S.t*i/40,px=ox+g.vx*t*sc,py=oy-(P.h0+g.vy*t-.5*P.g*t*t)*sc;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
const tipx=ox+Math.cos(P.a*D)*P.v*2.5,tipy=ly-Math.sin(P.a*D)*P.v*2.5;arr(ox,ly,tipx,tipy,'#f59e0b',3);dot(tipx,tipy,7,'#f59e0b');dot(ox,ly,6,'#8b5cf6');
dot(ox+g.vx*S.t*sc,oy-(P.h0+g.vy*S.t-.5*P.g*S.t*S.t)*sc,8,'#f59e0b',15);
tx('R = '+num(g.R)+' m',clamp(ox+g.R*sc,40,W-40),oy+22,'#a78bfa','center',12)},
down(x,y){const{sc,ox,oy}=pv(),ly=oy-P.h0*sc,a=ox+Math.cos(P.a*D)*P.v*2.5,b=ly-Math.sin(P.a*D)*P.v*2.5;if(Math.hypot(x-a,y-b)<32){drag=1;return 1}},
move(x,y){const{sc,ox,oy}=pv(),dx=x-ox,dy=oy-P.h0*sc-y;setP('a',Math.atan2(dy,dx)/D);setP('v',Math.hypot(dx,dy)/2.5);S.t=0;S.d=0},
up(){K.proj.init()},
out(){const g=pg();return[['المدى R',g.R,'m'],['أقصى ارتفاع',g.Hm,'m'],['زمن الطيران',g.tf,'s'],['المركبة الأفقية vₓ',g.vx,'m/s']]}};

/* ===== 3. البندول ===== */
const pb=()=>{const L=P.L/3*(H-100),px=W/2,py=36;return{px,py,L,bx:px+L*Math.sin(S.th),by:py+L*Math.cos(S.th)}};
K.pend={eq:'T = 2π√(L/g)',hint:'اسحب الكرة إلى أي زاوية ثم أفلتها',
par:[q('L','طول الخيط L',.3,3,.1,1,'m',1),q('g','الجاذبية g',1,25,.1,9.8,'m/s²',1),q('th','زاوية البداية θ₀',5,170,1,40,'°',1),q('b','الاحتكاك',0,1,.01,0,'')],
init(){S.th=P.th*D;S.w=0},
step(dt){if(drag)return;const n=8,h=dt/n;for(let i=0;i<n;i++){S.w+=(-(P.g/P.L)*Math.sin(S.th)-P.b*S.w)*h;S.th+=S.w*h}},
draw(){grid();const b=pb();ctx.fillStyle='#1e293b';ctx.fillRect(b.px-45,b.py-9,90,7);ln(b.px,b.py,b.px,b.py+b.L,'rgba(148,163,184,.3)',1,[4,4]);
ln(b.px,b.py,b.bx,b.by,'#94a3b8',2);dot(b.px,b.py,5,'#38bdf8');dot(b.bx,b.by,16,'#f59e0b',20);
ctx.strokeStyle='rgba(56,189,248,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.px,b.py,40,Math.PI/2,Math.PI/2-S.th,S.th>0);ctx.stroke();
tx(num(S.th/D,1)+'°',b.px+(S.th>0?-48:48),b.py+54,'#38bdf8','center',12)},
down(x,y){const b=pb();if(Math.hypot(x-b.bx,y-b.by)<34){drag=1;return 1}},
move(x,y){const b=pb();S.th=clamp(Math.atan2(x-b.px,y-b.py),-170*D,170*D);S.w=0;setP('th',Math.abs(S.th)/D)},
out(){const T=2*Math.PI*Math.sqrt(P.L/P.g),a=P.th*D;return[['T (زوايا صغيرة)',T,'s'],['T (للزاوية المحددة)',T*(1+a*a/16+11*a**4/3072),'s'],['الزاوية الحالية',S.th/D,'°'],['السرعة الزاوية',S.w,'rad/s'],['السرعة الخطية',Math.abs(S.w)*P.L,'m/s']]}};

/* ===== 4. النابض ===== */
K.spr={eq:'T = 2π√(m/k)  ،  F = −kx',hint:'اسحب الكتلة لأعلى أو لأسفل ثم أفلتها',
par:[q('m','الكتلة m',.1,5,.1,1,'kg'),q('k','ثابت النابض k',2,100,1,20,'N/m'),q('b','التخميد b',0,3,.01,0,'kg/s')],
init(){S.y=Z.y0||.8;S.v=0},
step(dt){if(drag)return;const n=8,h=dt/n;for(let i=0;i<n;i++){S.v+=(-P.k*S.y-P.b*S.v)/P.m*h;S.y+=S.v*h}},
draw(){grid();const x=W/2,by=200+S.y*100;ln(x-50,30,x+50,30,'#475569',5);ln(x-75,200,x+75,200,'rgba(56,189,248,.4)',1,[5,5]);tx('الاتزان',x+80,204,'#64748b','left',11);
ctx.strokeStyle='#38bdf8';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,30);const n=14,y1=by-22;for(let i=1;i<=n;i++)ctx.lineTo(x+(i%2?16:-16),30+(y1-30)*(i-.5)/n);ctx.lineTo(x,y1);ctx.stroke();
ctx.fillStyle='#f59e0b';ctx.shadowColor='#f59e0b';ctx.shadowBlur=18;ctx.fillRect(x-30,by-22,60,44);ctx.shadowBlur=0;tx(num(P.m,1)+' kg',x,by+5,'#0a0e1a','center',13)},
down(x,y){if(Math.abs(x-W/2)<52&&Math.abs(y-(200+S.y*100))<36){drag=1;return 1}},
move(x,y){S.y=clamp((y-200)/100,-1.2,1.2);S.v=0},
out(){const w=Math.sqrt(P.k/P.m),A=Math.hypot(S.y,S.v/w);return[['ω',w,'rad/s'],['T',2*Math.PI/w,'s'],['f',w/(2*Math.PI),'Hz'],['الإزاحة y',S.y,'m'],['السعة الحالية',A,'m'],['الطاقة الكلية',.5*P.k*A*A,'J']]}};

/* ===== 5. الدوائر الكهربائية ===== */
const oc=()=>{const m=Z.mode|0,V=P.V,R1=P.R1,R2=P.R2;let Rt,I,I1,I2=0;if(m===0){Rt=R1;I1=I=V/R1}else if(m===1){Rt=R1+R2;I1=I=V/Rt}else{Rt=R1*R2/(R1+R2);I1=V/R1;I2=V/R2;I=I1+I2}return{m,Rt,I,I1,I2}};
const og=()=>{const L=W*.14,R=W*.86,T=H*.24,B=H*.76;return{L,R,T,B,M:(L+R)/2,cy:(T+B)/2}};
const orp=()=>{const g=og(),m=Z.mode|0;return m===0?[['R1',g.M,g.T,0]]:m===1?[['R1',g.M,g.T,0],['R2',g.M,g.B,0]]:[['R1',g.R,g.cy,1],['R2',g.M,g.cy,1]]};
function dots(pts,ph,c){let tot=0;const sg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);sg.push(l);tot+=l}
for(let i=0;i<14;i++){let d=((i/14+ph)%1)*tot,j=0;while(j<sg.length-1&&d>sg[j]){d-=sg[j];j++}const f=sg[j]?d/sg[j]:0,a=pts[j],b=pts[j+1];dot(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,4,c,8)}}
K.ohm={eq:'V = IR',hint:'اسحب البطارية أو المقاومة لأعلى/أسفل لتغيير قيمتها',

$('ttl').textContent=(idx+1)+'. '+cur.n;$('eq').textContent=Z.eq||cur.eq||cur.k.eq||'';$('hint').textContent=cur.k.hint||'';list();build();reset();showOut()}
const cs=[...new Set(E.map(e=>e.c))];
$('cats').innerHTML=cs.map(c=>'<button class="tab" data-c="'+c+'">'+c+' <i>'+E.filter(e=>e.c===c).length+'</i></button>').join('');
$('tg').textContent=E.length+' تجربة تفاعلية — حرّك الأجسام بإصبعك وشاهد النتائج مباشرة';
$('cats').onclick=e=>{const b=e.target.closest('button');if(b)sel(E.findIndex(x=>x.c===b.dataset.c))};
$('lst').onclick=e=>{const b=e.target.closest('button');if(b)sel(+b.dataset.i)};
$('rs').onclick=()=>{paused=false;reset()};
$('pp').onclick=()=>{paused=!paused;$('pp').textContent=paused?'▶ تشغيل':'⏸ إيقاف'};
$('pv').onclick=()=>sel(idx-1);$('nx').onclick=()=>sel(idx+1);

/* ===== المؤشر ===== */
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e);if(cur.k.down&&cur.k.down(x,y)){try{cv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()}});
cv.addEventListener('pointermove',e=>{if(drag&&cur.k.move){const[x,y]=pos(e);cur.k.move(x,y)}});
const stop=()=>{if(drag){const d=drag;drag=0;if(cur.k.up)cur.k.up(d)}};
cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);

/* ===== الحلقة الرئيسية ===== */
function loop(t){requestAnimationFrame(loop);try{const dt=Math.min(Math.max((t-last)/1000,0),.05);last=t;if(!cur)return;if(!paused&&cur.k.step)cur.k.step(dt);ctx.clearRect(0,0,W,H);cur.k.draw();if(t-lo>120){lo=t;showOut()}}catch(err){console.error(err)}}
window.addEventListener('resize',()=>{const ow=W;fit();if(cur&&Math.abs(W-ow)>1)reset()});
fit();sel(0);requestAnimationFrame(loop);
</script>
</body>
</html>
